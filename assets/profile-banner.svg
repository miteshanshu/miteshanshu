<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
<title id="title">Mitesh Kumar Anshu - code and stories</title>
<desc id="desc">Deep blue banner with a fluid indigo and violet painted shape on the right.</desc>
