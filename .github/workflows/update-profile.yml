name: Update profile activity
on:
  push:
    paths:
      - scripts/update_profile.py
      - .github/workflows/update-profile.yml
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-activity
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate public activity assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile.py
      - name: Commit updated assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          user_id=$(gh api users/miteshanshu --jq .id)
          git config user.name miteshanshu
          git config user.email "${user_id}+miteshanshu@users.noreply.github.com"
          git add assets/github-activity-light.svg assets/github-activity-dark.svg assets/github-activity-data.json README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update profile activity"
          git pull --rebase origin main
          git push origin HEAD:main
